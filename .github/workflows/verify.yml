name: Verify reproducibility package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install verification dependencies
        shell: pwsh
        run: python -m pip install pytest==9.1.1 PyYAML==6.0.3
      - name: Run focused tests
        shell: pwsh
        run: python -m pytest -q
      - name: Verify publication boundary
        shell: pwsh
        run: python scripts/verify/verify_package.py --root .
      - name: Verify fresh clone files and imports
        shell: pwsh
        run: python scripts/verify/verify_clone.py --root .
